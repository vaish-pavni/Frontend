<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body>
    <h1>Feedback form</h1>
    <label for="username">Username:</label>
    <input type="text" placeholder="Janee-Cruise" required>
    <br><br>
    <label for="password">Password:</label>
    <input type="text" id="password" minlength="6" maxlength="12" required>
    <br><br>
    <label for="Rating">Rating:</label>
    <input type="radio" name="rating" value="🌟"> 
    <input type="radio" name="rating" value="🌟🌟">
    <input type="radio" name="rating" value="🌟🌟🌟">
    <input type="radio" name="rating" value="🌟🌟🌟🌟">
    <input type="radio" name="rating" value="🌟🌟🌟🌟🌟" min="1" max="5">
    <br><br>
    <label for="Feedback box">Feedback box:</label>
    <textarea id="Feedback" name="Feedback" rows="5" cols="40" placeholder="Write your feedback here.."></textarea>
    <br><br>
    <input type="submit">
</body>
</html>
